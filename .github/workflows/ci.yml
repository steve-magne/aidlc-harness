name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # La suite du moteur, sur plusieurs versions de Python. Le harnais promet de tourner
  # chez n'importe quel consommateur avec `python3` seul (aucun `pip install`) : cette
  # matrice est la porte qui défend cette promesse au lieu de la répéter. Élargir la
  # liste est une ligne ; si une version rougit, c'est la promesse qui a cassé.
  tests:
    name: Suite du moteur (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: aidlc.py test
        run: python3 plugins/aidlc-core/scripts/aidlc.py test

  checks:
    name: Gates du harnais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Portes canoniques du dépôt, dans l'ordre : hygiène du code via le moteur
      # (check-python, check-json — CLAUDE.md, règle 6 : tout Python compile, tout JSON
      # parse), registre d'agents (les manifestes agent.json de CE dépôt doivent être
      # valides ; ceux des autres équipes ne rougissent jamais notre CI), conformance
      # OKF v0.2 des deux bundles (knowledge/, docs/), puis le score de maturité du
      # harnais qui les agrège — exit non nul = build rouge. Ces portes sont le moteur
      # seul : pas de dépendance externe, stdlib Python uniquement. La suite elle-même
      # tourne dans le job `tests`, sur plusieurs versions de Python.
      - name: Hygiène syntaxique (check-python, check-json)
        run: |
          python3 plugins/aidlc-core/scripts/aidlc.py check-python
          python3 plugins/aidlc-core/scripts/aidlc.py check-json
      - name: Registre d'agents (agents --strict)
        run: python3 plugins/aidlc-core/scripts/aidlc.py agents --strict
      - name: Conformance OKF v0.2 de knowledge/
        run: python3 plugins/aidlc-core/scripts/aidlc.py check-okf knowledge
      - name: Conformance OKF v0.2 de docs/
        run: python3 plugins/aidlc-core/scripts/aidlc.py check-okf docs

      # La porte agrégée : cinq axes déterministes notés sur 5 (hygiène, contrats
      # d'agents, suite + règle « un module, un test en face », couverture confrontée au
      # plancher figé de .aidlc/coverage.json, conformance OKF), moyenne comparée au
      # seuil de pipeline.json et plancher par axe appliqué. Exit 2 = build rouge.
      # Elle remplace la porte `coverage` : même mesure, en lecture seule (elle ne
      # rebase aucun plancher), et elle refuse en plus ce qu'une couverture verte
      # laissait passer — un module neuf sans test en face, par exemple. C'est
      # exactement ce que rejoue .githooks/pre-commit en local.
      # Mesurée sur une seule version de Python : le taux de couverture varie d'une
      # version à l'autre (branches conditionnelles), et comparer un plancher unique à
      # plusieurs mesures produirait de fausses régressions.
      - name: Score de maturité du harnais (selfscore)
        run: python3 plugins/aidlc-core/scripts/aidlc.py selfscore

      # Chaque plugin du dépôt (aidlc-core, aidlc-plan, et toute étape scaffoldée plus
      # tard) reste valide pour Claude Code : manifest, hooks et chemins réels. Le CLI
      # est un outil de build du runner (npm), pas une dépendance du moteur — tout le
      # reste du workflow reste stdlib Python.
      - name: Validation des plugins Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          for plugin in plugins/aidlc-*; do
            claude plugin validate "$plugin"
          done
